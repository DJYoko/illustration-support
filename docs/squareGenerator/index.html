<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Square Generator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/common.css" />
    <script src="./script/script.js"></script>
  </head>

  <body>
    <div id="wrapper">
      <h1 class="mainTitle no-print">Square Generator</h1>
      <!-- preview 210 / 297-->
      <div class="previewWrapper">
        <div class="previewInner">
          <label class="previewImageItem" for="imageInput_1"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_2"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_3"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_4"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_5"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_6"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_7"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_8"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_9"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_10"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_11"><img class="previewImage" /></label>
          <label class="previewImageItem" for="imageInput_12"><img class="previewImage" /></label>
        </div>
      </div>
      <!-- input -->
      <div class="inputArea no-print">
        <div class="inputItem">
          <label>
            image 1
            <input type="file" class="inputFile" id="imageInput_1" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 2
            <input type="file" class="inputFile" id="imageInput_2" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 3
            <input type="file" class="inputFile" id="imageInput_3" />
          </label>
        </div>
        <hr />
        <div class="inputItem">
          <label>
            image 4
            <input type="file" class="inputFile" id="imageInput_4" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 5
            <input type="file" class="inputFile" id="imageInput_5" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 6
            <input type="file" class="inputFile" id="imageInput_6" />
          </label>
        </div>
        <hr />
        <div class="inputItem">
          <label>
            image 7
            <input type="file" class="inputFile" id="imageInput_7" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 8
            <input type="file" class="inputFile" id="imageInput_8" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 9
            <input type="file" class="inputFile" id="imageInput_9" />
          </label>
        </div>
        <hr />
        <div class="inputItem">
          <label>
            image 10
            <input type="file" class="inputFile" id="imageInput_10" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 11
            <input type="file" class="inputFile" id="imageInput_11" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 12
            <input type="file" class="inputFile" id="imageInput_12" />
          </label>
        </div>
        <hr />
        <button id="printBtn">PRINT</button>
        <p>PDF保存時に注意</p>
        <p>印刷ダイアログで： 「詳細設定」みたいなところを開く 「ヘッダーとフッター」→ OFF</p>
      </div>
    </div>
  </body>
</html>
