<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Front Generator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./css/common.css" />
    <script src="./script/script.js"></script>
  </head>

  <body>
    <div id="wrapper">
      <h1 class="mainTitle">Front Generator</h1>
      <div class="previewWrapper">
        <canvas id="previewCanvas" class="previewCanvas"></canvas>
      </div>
      <!-- input -->
      <div class="inputArea">
        <div class="inputItem">
          <label>
            Main Title
            <input type="text" class="titleLabel" id="titleLabel" value="PIXELINA" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            Year / Month
            <input type="month" class="inputYearMonth" id="inputYearMonth" value="2026-01" />
          </label>
        </div>
        <div class="inputItem">
          <label>
            image 1
            <input type="file" class="inputFile" id="inputFile" />
          </label>
        </div>
      </div>
    </div>
  </body>
</html>
